description: >-
  Binding between Drip's MCP tools and the REST operations that back them. The
  crosswalk is EMPTY on purpose. Drip's MCP server is real and reachable (see
  mcp/drip-mcp.yml) but its tools/list is OAuth-gated, and Drip publishes no
  llms.txt, no MCP documentation page and no tool inventory anywhere public, so
  there is no honest source for tool names. Mapping "probably there is a
  create_subscriber tool" would be fabrication of exactly the kind this
  pipeline forbids, so nothing is guessed. What IS recorded is the other half
  of the picture: every REST operation the catalog holds, listed as rest_only,
  which is the accurate statement today — no tool is known to cover any of
  them.

