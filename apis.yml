  name: Drip REST API
  description: >-
    REST API for Drip exposing subscribers, tags, custom fields, broadcasts, email campaigns, events,
    conversions, workflows, shopper activity (orders, carts, products), purchases, and webhooks. Supports
    both API token Basic authentication for private integrations and OAuth 2.0 for public apps, with a
    rate limit of 3,600 requests per hour.
