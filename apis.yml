- aid: drip:drip-mcp
  name: Drip MCP Server
  description: >-
    Drip operates a remote Model Context Protocol server at
    https://api.getdrip.com/mcp, protected by its OAuth 2.0 authorization server
    and discoverable through RFC 9728 protected-resource metadata. Probed live
    2026-08-13: the endpoint answers JSON-RPC with a 401 and a
    WWW-Authenticate Bearer challenge, so the tool inventory requires an
    authenticated introspection pass. The server is not mentioned anywhere in
    Drip's public API reference.
  humanURL: https://developer.drip.com/
  baseURL: https://api.getdrip.com/mcp
